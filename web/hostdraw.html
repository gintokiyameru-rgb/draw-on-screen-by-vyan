<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VyanHQ Draw — Host</title><style>
:root{--bg:#14151a;--panel:#1c1e24;--line:#343743;--text:#f4f5f7;--muted:#a3a9b8;--accent:#9b6cff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,sans-serif;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:54px 1fr 112px}.top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:#1c1e24}.brand{font-weight:800}.room{font-size:12px;color:var(--muted)}.status{margin-left:auto;font-size:12px}.stage{position:relative;min-height:0;overflow:hidden;background:transparent}.stage.checker{background-color:#17191e;background-image:linear-gradient(45deg,#1c1f25 25%,transparent 25%),linear-gradient(-45deg,#1c1f25 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1c1f25 75%),linear-gradient(-45deg,transparent 75%,#1c1f25 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#1c1e24;border-top:1px solid var(--line)}button{border:1px solid var(--line);background:#252832;color:var(--text);border-radius:7px;padding:7px 10px;cursor:pointer}.active{background:var(--accent)}label{font-size:11px;color:var(--muted)}input[type=range]{width:110px}.spacer{flex:1}.danger{color:#ff9eab}.pill{border:1px solid var(--line);padding:5px 8px;border-radius:999px;font-size:10px;color:var(--muted)}
</style></head><body><div class="app"><header class="top"><div class="brand">VyanHQ Draw Host</div><div class="room" id="room"></div><div class="status" id="status">connecting…</div></header><main class="stage checker" id="stage"><canvas id="canvas"></canvas></main><footer class="toolbar"><button class="active" data-tool="pen">Pen</button><button data-tool="eraser">Eraser</button><button data-tool="line">Line</button><button data-tool="rect">Rect</button><button data-tool="ellipse">Circle</button><button data-tool="arrow">Arrow</button><button data-tool="text">Text</button><button id="undo">Undo</button><button id="redo">Redo</button><label>Brush <input id="brush" type="range" min="1" max="80" value="8"></label><label>Eraser <input id="eraser" type="range" min="5" max="120" value="32"></label><input id="color" type="color" value="#ffffff"><button id="clearMine">Clear Mine</button><button id="clearMembers" class="danger">Clear Members</button><span class="spacer"></span><span class="pill" id="lockState">Unlocked</span></footer></div>
<script>
const qs=new URLSearchParams(location.search),room=qs.get('room')||'',token=qs.get('token')||'',canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const s={tool:'pen',color:'#ffffff',brush:8,eraser:32,zoom:1,objects:new Map(),undo:[],redo:[],drawing:false,start:null,current:null,ws:null,userId:'host',locked:false};
document.getElementById('room').textContent=room;
function resize(){const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);redraw()}addEventListener('resize',resize);resize();
function status(t,ok=true){document.getElementById('status').textContent=t;document.getElementById('status').style.color=ok?'#65d995':'#f0ad4e'}
function emit(m){if(s.ws?.readyState===1)s.ws.send(JSON.stringify({...m,userId:s.userId}))}
function wsConnect(){if(!room||!token){status('missing token',false);return}const base=location.protocol==='https:'?'wss://':'ws://';const ws=new WebSocket(base+location.host+'/ws?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token)+'&role=host');s.ws=ws;ws.onopen=()=>status('connected');ws.onclose=()=>{status('reconnecting…',false);setTimeout(wsConnect,1200)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='snapshot'){s.objects=new Map(m.objects.map(o=>[o.id,o]));s.locked=!!m.locked;updateLock();redraw()}else if(m.type==='object'){s.objects.set(m.object.id,m.object);redraw()}else if(m.type==='delete'){s.objects.delete(m.id);redraw()}else if(m.type==='clear-members'){for(const[id,o]of s.objects)if(o.userId!=='host')s.objects.delete(id);redraw()}else if(m.type==='clear-host'){for(const[id,o]of s.objects)if(o.userId==='host')s.objects.delete(id);redraw()}else if(m.type==='clear'){s.objects.clear();redraw()}else if(m.type==='lock'){s.locked=!!m.locked;updateLock()}}}wsConnect();
function updateLock(){document.getElementById('lockState').textContent=s.locked?'Locked':'Unlocked';}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/s.zoom,y:(e.clientY-r.top)/s.zoom}}
function drawObj(o){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=o.color||'#fff';ctx.fillStyle=o.color||'#fff';ctx.lineWidth=o.size||4;ctx.globalCompositeOperation='source-over';if(o.type==='stroke'||o.type==='eraser'){ctx.globalCompositeOperation=o.type==='eraser'?'destination-out':'source-over';ctx.beginPath();o.points.forEach((p,i)=>i?ctx.lineTo(p.x*s.zoom,p.y*s.zoom):ctx.moveTo(p.x*s.zoom,p.y*s.zoom));ctx.stroke()}else{const{x,y,w,h}=o,X=x*s.zoom,Y=y*s.zoom,W=w*s.zoom,H=h*s.zoom;if(o.type==='line'){ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X+W,Y+H);ctx.stroke()}else if(o.type==='rect'){ctx.strokeRect(X,Y,W,H)}else if(o.type==='ellipse'){ctx.beginPath();ctx.ellipse(X+W/2,Y+H/2,Math.abs(W/2),Math.abs(H/2),0,0,Math.PI*2);ctx.stroke()}else if(o.type==='arrow'){ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X+W,Y+H);ctx.stroke();const a=Math.atan2(H,W),len=14*s.zoom;ctx.beginPath();ctx.moveTo(X+W,Y+H);ctx.lineTo(X+W-len*Math.cos(a-.5),Y+H-len*Math.sin(a-.5));ctx.moveTo(X+W,Y+H);ctx.lineTo(X+W-len*Math.cos(a+.5),Y+H-len*Math.sin(a+.5));ctx.stroke()}else if(o.type==='text'){ctx.font=`${o.size||24}px Inter, sans-serif`;ctx.fillText(o.text,X,Y)}}ctx.restore()}
function redraw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);for(const o of s.objects.values())drawObj(o);if(s.current)drawObj(s.current)}
function pointerDown(e){if(s.locked)return;const p=pos(e);s.drawing=true;s.start=p;if(s.tool==='pen'||s.tool==='eraser')s.current={id:'tmp',type:s.tool==='eraser'?'eraser':'stroke',userId:'host',color:s.color,size:s.tool==='eraser'?s.eraser:s.brush,points:[p]};else s.current={id:'tmp',type:s.tool,userId:'host',color:s.color,size:s.brush,x:p.x,y:p.y,w:0,h:0}}
function pointerMove(e){if(!s.drawing)return;const p=pos(e);if(s.tool==='pen'||s.tool==='eraser')s.current.points.push(p);else{s.current.w=p.x-s.start.x;s.current.h=p.y-s.start.y}redraw()}
function pointerUp(){if(!s.drawing)return;s.drawing=false;if(s.tool==='text'){const t=prompt('Text');if(t){const o={id:crypto.randomUUID(),type:'text',userId:'host',color:s.color,size:s.brush*3,x:s.start.x,y:s.start.y,text:t};s.objects.set(o.id,o);s.undo.push(o);emit({type:'object',object:o})}s.current=null;redraw();return}const o={...s.current,id:crypto.randomUUID()};s.objects.set(o.id,o);s.undo.push(o);s.redo=[];s.current=null;emit({type:'object',object:o});redraw()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointerDown(e)});canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
function tool(t){s.tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));canvas.style.cursor=t==='text'?'text':'crosshair'}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool(b.dataset.tool));document.getElementById('brush').oninput=e=>s.brush=+e.target.value;document.getElementById('eraser').oninput=e=>s.eraser=+e.target.value;document.getElementById('color').oninput=e=>s.color=e.target.value;
document.getElementById('undo').onclick=()=>{const o=s.undo.pop();if(o){s.objects.delete(o.id);s.redo.push(o);emit({type:'delete',id:o.id});redraw()}};document.getElementById('redo').onclick=()=>{const o=s.redo.pop();if(o){s.objects.set(o.id,o);s.undo.push(o);emit({type:'object',object:o});redraw()}};document.getElementById('clearMine').onclick=()=>emit({type:'clear-host'});document.getElementById('clearMembers').onclick=()=>emit({type:'clear-members'});
</script></body></html>
