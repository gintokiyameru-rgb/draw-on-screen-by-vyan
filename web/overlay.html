<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#c{width:100%;height:100%;display:block;background:transparent}</style></head><body><canvas id="c"></canvas><script>
const qs=new URLSearchParams(location.search),room=qs.get('room')||'vyanhq-live',token=qs.get('token')||'demo',c=document.getElementById('c'),ctx=c.getContext('2d');let objects=new Map();function size(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);redraw()}addEventListener('resize',size);size();function draw(o){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=o.color||'#fff';ctx.globalCompositeOperation=o.type==='eraser'?'destination-out':'source-over';ctx.lineWidth=o.size||4; if(o.type==='stroke'||o.type==='eraser'){ctx.beginPath();o.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}else{const{x,y,w,h}=o;if(o.type==='line'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y+h);ctx.stroke()}else if(o.type==='rect'){ctx.strokeRect(x,y,w,h)}else if(o.type==='ellipse'){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);ctx.stroke()}else if(o.type==='arrow'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y+h);ctx.stroke();const a=Math.atan2(h,w),len=14;ctx.beginPath();ctx.moveTo(x+w,y+h);ctx.lineTo(x+w-len*Math.cos(a-.5),y+h-len*Math.sin(a-.5));ctx.moveTo(x+w,y+h);ctx.lineTo(x+w-len*Math.cos(a+.5),y+h-len*Math.sin(a+.5));ctx.stroke()}else if(o.type==='text'){ctx.globalCompositeOperation='source-over';ctx.fillStyle=o.color;ctx.font=`${o.size||24}px Inter, sans-serif`;ctx.fillText(o.text,x,y)}}ctx.restore()}function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const o of objects.values())draw(o)}function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token)+'&role=overlay');ws.onclose=()=>setTimeout(connect,1000);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='snapshot'){objects=new Map(m.objects.map(o=>[o.id,o]));redraw()}else if(m.type==='object'){objects.set(m.object.id,m.object);redraw()}else if(m.type==='delete'){objects.delete(m.id);redraw()}else if(m.type==='clear-user'){for(const[id,o]of objects)if(o.userId===m.userId)objects.delete(id);redraw()}else if(m.type==='clear'){objects.clear();redraw()}}}connect();
</script></body></html>
