<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>VyanHQ Draw — Member Studio</title>
<style>
:root{--bg:#15161a;--panel:#1d1f25;--panel2:#252833;--line:#353947;--text:#f3f4f6;--muted:#a8adbb;--accent:#9b6cff;--danger:#ff5b6e}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit}button{border:0;color:inherit;background:none}
.app{height:100%;display:grid;grid-template-rows:56px 1fr 108px}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(29,31,37,.96);backdrop-filter:blur(12px);z-index:10}
.brand{font-weight:800;letter-spacing:.2px}.brand span{color:var(--accent)} .room{font-size:12px;color:var(--muted);padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.status{margin-left:auto;font-size:12px;color:#78e5a5;display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#43d889;box-shadow:0 0 10px #43d889}
.stage{position:relative;min-height:0;overflow:hidden;background-color:#141519;background-image:linear-gradient(45deg,#17191e 25%,transparent 25%),linear-gradient(-45deg,#17191e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#17191e 75%),linear-gradient(-45deg,transparent 75%,#17191e 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:rgba(29,31,37,.98);border-top:1px solid var(--line);z-index:10}
.group{display:flex;align-items:center;gap:5px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tool{min-width:40px;height:34px;padding:0 10px;border-radius:7px;cursor:pointer;color:var(--muted)}.tool:hover{background:var(--panel2);color:var(--text)}.tool.active{background:var(--accent);color:white}.tool.danger{color:#ff9daa}.tool.danger:hover{background:rgba(255,91,110,.16)}
.slider{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.slider input{width:118px}.value{width:34px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.colors{display:flex;gap:5px}.swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.18);cursor:pointer}.swatch.active{outline:2px solid white;outline-offset:1px}.customColor{width:28px;height:28px;padding:0;border-radius:7px;background:transparent}
.help{margin-left:auto;font-size:11px;color:var(--muted)}
@media(max-width:780px){.app{grid-template-rows:52px 1fr 150px}.toolbar{align-content:flex-start;overflow:auto}.help{display:none}.slider input{width:90px}.room{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">Vyan<span>HQ</span> Draw</div><div class="room" id="roomLabel">Room —</div><div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div></header>
  <main class="stage" id="stage"><canvas id="canvas"></canvas></main>
  <footer class="toolbar">
    <div class="group" id="tools">
      <button class="tool active" data-tool="pen">Pen</button>
      <button class="tool" data-tool="eraser">Eraser</button>
      <button class="tool" data-tool="line">Line</button>
      <button class="tool" data-tool="rect">Rect</button>
      <button class="tool" data-tool="ellipse">Circle</button>
      <button class="tool" data-tool="arrow">Arrow</button>
      <button class="tool" data-tool="text">Text</button>
      <button class="tool" data-tool="pan">Pan</button>
    </div>
    <div class="group slider"><span>Brush</span><input id="brush" type="range" min="1" max="80" value="8"><span class="value" id="brushValue">8</span></div>
    <div class="group slider"><span>Eraser</span><input id="eraserSize" type="range" min="5" max="120" value="32"><span class="value" id="eraserValue">32</span></div>
    <div class="group colors" id="colors">
      <button class="swatch active" data-color="#ffffff" style="background:#ffffff"></button><button class="swatch" data-color="#9b6cff" style="background:#9b6cff"></button><button class="swatch" data-color="#59d8ff" style="background:#59d8ff"></button><button class="swatch" data-color="#5ee18b" style="background:#5ee18b"></button><button class="swatch" data-color="#ffcf5a" style="background:#ffcf5a"></button><button class="swatch" data-color="#ff6b81" style="background:#ff6b81"></button><button class="swatch" data-color="#202128" style="background:#202128"></button><input id="customColor" class="customColor" type="color" value="#ffffff">
    </div>
    <div class="group"><button class="tool" id="undo">Undo</button><button class="tool" id="redo">Redo</button><button class="tool" id="clear">Clear</button></div>
    <div class="group slider"><span>Zoom</span><input id="zoom" type="range" min="50" max="200" value="100"><span class="value" id="zoomValue">100%</span></div>
    <div class="help">Draw freely • Line/shape tools • Pen/Eraser sizes • Clear removes your drawings</div>
  </footer>
</div>
<script>
const qs=new URLSearchParams(location.search); const room=qs.get('room')||'vyanhq-live'; const token=qs.get('token')||'demo';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'); const stage=document.getElementById('stage');
const state={tool:'pen',color:'#fff',brush:8,eraser:32,zoom:1,objects:new Map(),undo:[],redo:[],drawing:false,start:null,current:null,points:[],ws:null,userId:'u-'+Math.random().toString(36).slice(2,9)};
document.getElementById('roomLabel').textContent='Room '+room;
function resize(){const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);redraw()} window.addEventListener('resize',resize); resize();
function setStatus(t,ok=false){document.getElementById('status').textContent=t;document.getElementById('dot').style.background=ok?'#43d889':'#f4ad4d';document.getElementById('dot').style.boxShadow=ok?'0 0 10px #43d889':'0 0 10px #f4ad4d'}
function emit(m){if(state.ws&&state.ws.readyState===1) state.ws.send(JSON.stringify({...m,userId:state.userId,room,token}))}
function connect(){const base=location.protocol==='https:'?'wss://':'ws://';const u=base+location.host+'/ws?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token)+'&role=member';const ws=new WebSocket(u);state.ws=ws;ws.onopen=()=>setStatus('connected',true);ws.onclose=()=>{setStatus('reconnecting…');setTimeout(connect,1200)};ws.onerror=()=>setStatus('connection error');ws.onmessage=e=>{const m=JSON.parse(e.data); if(m.type==='snapshot'){state.objects=new Map(m.objects.map(o=>[o.id,o]));redraw()} else if(m.type==='object'){state.objects.set(m.object.id,m.object);redraw()} else if(m.type==='delete'){state.objects.delete(m.id);redraw()} else if(m.type==='clear-user'){for(const [id,o] of state.objects) if(o.userId===m.userId) state.objects.delete(id);redraw()} else if(m.type==='clear'){state.objects.clear();redraw()}}} connect();
function pos(e){const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/state.zoom,y:(e.clientY-r.top)/state.zoom}}
function drawObj(o,preview=false){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=o.color||'#fff';ctx.fillStyle=o.fill||'transparent';
 if(o.type==='stroke'||o.type==='eraser'){ctx.globalCompositeOperation=o.type==='eraser'?'destination-out':'source-over';ctx.lineWidth=o.size;ctx.beginPath();o.points.forEach((p,i)=>i?ctx.lineTo(p.x*state.zoom,p.y*state.zoom):ctx.moveTo(p.x*state.zoom,p.y*state.zoom));ctx.stroke()}
 else {ctx.globalCompositeOperation='source-over';ctx.lineWidth=o.size||4;const x=o.x*state.zoom,y=o.y*state.zoom,w=o.w*state.zoom,h=o.h*state.zoom; if(o.type==='line'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo((x+w),(y+h));ctx.stroke()} else if(o.type==='rect'){ctx.strokeRect(x,y,w,h)} else if(o.type==='ellipse'){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);ctx.stroke()} else if(o.type==='arrow'){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y+h);ctx.stroke();const a=Math.atan2(h,w),len=14*state.zoom;ctx.beginPath();ctx.moveTo(x+w,y+h);ctx.lineTo(x+w-len*Math.cos(a-.5),y+h-len*Math.sin(a-.5));ctx.moveTo(x+w,y+h);ctx.lineTo(x+w-len*Math.cos(a+.5),y+h-len*Math.sin(a+.5));ctx.stroke()} else if(o.type==='text'){ctx.fillStyle=o.color;ctx.font=`${o.size||24}px Inter, sans-serif`;ctx.fillText(o.text,x,y)}} ctx.restore()}
function redraw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);for(const o of state.objects.values())drawObj(o); if(state.current) drawObj(state.current,true)}
function snapshot(){return [...state.objects.values()]}
function pointerDown(e){if(state.tool==='pan')return; state.drawing=true; state.start=pos(e); state.current=null;state.points=[state.start]; if(state.tool==='pen'||state.tool==='eraser')state.current={id:'tmp',type:state.tool==='eraser'?'eraser':'stroke',userId:state.userId,color:state.color,size:state.tool==='eraser'?state.eraser:state.brush,points:[state.start]}; else if(['line','rect','ellipse','arrow'].includes(state.tool))state.current={id:'tmp',type:state.tool,userId:state.userId,color:state.color,size:state.brush,x:state.start.x,y:state.start.y,w:0,h:0}; redraw()}
function pointerMove(e){if(!state.drawing)return;const p=pos(e); if(state.tool==='pen'||state.tool==='eraser'){state.current.points.push(p)} else {state.current.w=p.x-state.start.x;state.current.h=p.y-state.start.y} redraw()}
function pointerUp(e){if(!state.drawing)return; state.drawing=false; if(state.tool==='text'){const text=prompt('Text'); if(text)emit({type:'object',object:{...state.current,id:crypto.randomUUID(),type:'text',text,size:state.brush*3,x:state.start.x,y:state.start.y}});state.current=null;redraw();return} const o={...state.current,id:crypto.randomUUID()}; if(o.points&&o.points.length<2){state.current=null;redraw();return} state.objects.set(o.id,o);state.undo.push(JSON.parse(JSON.stringify(o)));state.redo=[];state.current=null;redraw();emit({type:'object',object:o})}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointerDown(e)});canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
function activateTool(t){state.tool=t;document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));canvas.style.cursor=t==='pan'?'grab':t==='text'?'text':'crosshair'} document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>activateTool(b.dataset.tool));
document.getElementById('brush').oninput=e=>{state.brush=+e.target.value;document.getElementById('brushValue').textContent=state.brush}; document.getElementById('eraserSize').oninput=e=>{state.eraser=+e.target.value;document.getElementById('eraserValue').textContent=state.eraser}; document.getElementById('zoom').oninput=e=>{state.zoom=+e.target.value/100;document.getElementById('zoomValue').textContent=e.target.value+'%';redraw()};
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{state.color=b.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active')}); document.getElementById('customColor').oninput=e=>state.color=e.target.value;
document.getElementById('clear').onclick=()=>emit({type:'clear-user'}); document.getElementById('undo').onclick=()=>{const o=state.undo.pop();if(o){state.objects.delete(o.id);state.redo.push(o);emit({type:'delete',id:o.id});redraw()}};document.getElementById('redo').onclick=()=>{const o=state.redo.pop();if(o){state.objects.set(o.id,o);state.undo.push(o);emit({type:'object',object:o});redraw()}};
</script>
</body></html>
