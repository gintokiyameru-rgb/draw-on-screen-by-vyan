<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VyanHQ Draw Host</title><style>body{margin:0;background:#111318;color:#eee;font-family:system-ui;padding:28px}.card{max-width:900px;margin:auto;background:#1b1e25;border:1px solid #303541;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0004}h1{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{border:1px solid #3a4050;background:#252a35;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}button.primary{background:#9b6cff;border-color:#9b6cff}input{width:100%;padding:11px;border-radius:10px;border:1px solid #333a48;background:#111318;color:#fff}.label{font-size:12px;color:#aab0bf;margin:14px 0 5px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#232735;color:#aeb6c9;font-size:12px}.warn{color:#ffbf66}.ok{color:#74e2a1}</style></head><body><div class="card"><h1>VyanHQ Draw — Host</h1><p>Create a private room. The member link and the OBS overlay link use different credentials.</p><button id="new" class="primary">Create New Room</button><div id="info" hidden><div class="label">Room</div><input id="room" readonly><div class="label">Member Link</div><input id="member" readonly><div class="label">OBS Overlay URL</div><input id="overlay" readonly><div class="row"><button id="copyMember">Copy Member Link</button><button id="copyOverlay">Copy OBS URL</button><button id="clear">Clear All</button><button id="lock">Lock</button><button id="unlock">Unlock</button></div><span class="pill" id="state">Room ready</span></div></div><script>
const $=id=>document.getElementById(id);let data=null;function base(){return location.origin}async function create(){const r=await fetch('/api/room/new',{method:'POST'});data=await r.json();$('room').value=data.room;$('member').value=base()+'/member?room='+encodeURIComponent(data.room)+'&token='+encodeURIComponent(data.memberToken);$('overlay').value=base()+'/overlay?room='+encodeURIComponent(data.room)+'&token='+encodeURIComponent(data.hostToken);$('info').hidden=false}
$('new').onclick=create;async function copy(id){await navigator.clipboard.writeText($(id).value);$('state').textContent='Copied'}$('copyMember').onclick=()=>copy('member');$('copyOverlay').onclick=()=>copy('overlay');async function ctl(action){if(!data)return;const r=await fetch('/api/control',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room:data.room,hostToken:data.hostToken,action})});const j=await r.json();$('state').textContent=action==='lock'?'🔒 Locked':action==='unlock'?'🟢 Unlocked':j.ok?'Canvas cleared':'Error'}$('clear').onclick=()=>ctl('clear');$('lock').onclick=()=>ctl('lock');$('unlock').onclick=()=>ctl('unlock');
</script></body></html>
