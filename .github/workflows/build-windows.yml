name: Build VyanHQ Draw for Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout VyanHQ Draw
        uses: actions/checkout@v5

      - name: Clone official OBS plugin template
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git obs-template

      - name: Copy VyanHQ files into template
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\src\plugin-main.cpp" "$env:GITHUB_WORKSPACE\obs-template\src\plugin-main.cpp" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\CMakeLists.txt" "$env:GITHUB_WORKSPACE\obs-template\CMakeLists.txt" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\buildspec.json" "$env:GITHUB_WORKSPACE\obs-template\buildspec.json" -Force
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\obs-template\data\locale" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\data\locale\en-US.ini" "$env:GITHUB_WORKSPACE\obs-template\data\locale\en-US.ini" -Force

      - name: Patch template for OBS 32.2.2 and VyanHQ
        shell: pwsh
        working-directory: obs-template
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json

          # Set existing scalar properties instead of Add-Member. This works
          # whether the template already contains an empty email property.
          $spec.email = "vyanhq@example.invalid"

          if (-not $spec.platformConfig) {
            $spec | Add-Member -NotePropertyName platformConfig -NotePropertyValue ([pscustomobject]@{})
          }

          if (-not $spec.platformConfig.macos) {
            $spec.platformConfig | Add-Member -NotePropertyName macos -NotePropertyValue ([pscustomobject]@{})
          }
          $spec.platformConfig.macos.bundleId = "com.vyanhq.vyanhq-draw"

          # Fix the OBS 32.2.2 source hash for the dependency resolver.
          $obsUrl = "https://github.com/obsproject/obs-studio/archive/refs/tags/32.2.2.zip"
          $obsZip = Join-Path $env:GITHUB_WORKSPACE "obs-32.2.2.zip"
          Invoke-WebRequest -Uri $obsUrl -OutFile $obsZip
          $obsHash = (Get-FileHash $obsZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $spec.dependencies.'obs-studio'.hashes.'windows-x64' = $obsHash
          Remove-Item $obsZip -Force

          $spec | ConvertTo-Json -Depth 50 | Set-Content buildspec.json -Encoding UTF8

          # Enable Qt + OBS frontend API in every preset object that defines cacheVariables.
          $presets = Get-Content CMakePresets.json -Raw | ConvertFrom-Json

          function Patch-Preset($node) {
            if ($null -eq $node) { return }
            if ($node.PSObject.Properties.Name -contains 'cacheVariables') {
              if (-not $node.cacheVariables) {
                $node.cacheVariables = [pscustomobject]@{}
              }
              $node.cacheVariables.ENABLE_FRONTEND_API = 'ON'
              $node.cacheVariables.ENABLE_QT = 'ON'
            }
            if ($node.PSObject.Properties.Name -contains 'configurePresets') {
              foreach ($p in $node.configurePresets) { Patch-Preset $p }
            }
            if ($node.PSObject.Properties.Name -contains 'buildPresets') {
              foreach ($p in $node.buildPresets) { Patch-Preset $p }
            }
          }

          Patch-Preset $presets
          $presets | ConvertTo-Json -Depth 50 | Set-Content CMakePresets.json -Encoding UTF8

      - name: Build with official OBS Windows build script
        shell: pwsh
        working-directory: obs-template
        run: |
          ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload build logs and release files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: VyanHQ-Draw-debug
          path: |
            obs-template/build/**
            obs-template/release/**
          if-no-files-found: ignore
