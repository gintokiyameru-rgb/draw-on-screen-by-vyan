name: Build VyanHQ Draw for Windows x64

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout VyanHQ Draw
        uses: actions/checkout@v5

      - name: Clone official OBS plugin template
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git obs-template

      - name: Copy VyanHQ files into template
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\src\plugin-main.cpp" "$env:GITHUB_WORKSPACE\obs-template\src\plugin-main.cpp" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\CMakeLists.txt" "$env:GITHUB_WORKSPACE\obs-template\CMakeLists.txt" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\buildspec.json" "$env:GITHUB_WORKSPACE\obs-template\buildspec.json" -Force
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\obs-template\data\locale" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\data\locale\en-US.ini" "$env:GITHUB_WORKSPACE\obs-template\data\locale\en-US.ini" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\data\locale\en-GB.ini" "$env:GITHUB_WORKSPACE\obs-template\data\locale\en-GB.ini" -Force

      - name: Patch template for OBS 32.2.2 and VyanHQ
        shell: pwsh
        working-directory: obs-template
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $spec.email = "vyanhq@example.invalid"
          if (-not ($spec.PSObject.Properties.Name -contains 'platformConfig')) { $spec | Add-Member -NotePropertyName platformConfig -NotePropertyValue ([pscustomobject]@{}) -Force }
          if (-not ($spec.platformConfig.PSObject.Properties.Name -contains 'macos')) { $spec.platformConfig | Add-Member -NotePropertyName macos -NotePropertyValue ([pscustomobject]@{}) -Force }
          if (-not ($spec.platformConfig.macos.PSObject.Properties.Name -contains 'bundleId')) { $spec.platformConfig.macos | Add-Member -NotePropertyName bundleId -NotePropertyValue "com.vyanhq.vyanhq-draw" -Force } else { $spec.platformConfig.macos.bundleId = "com.vyanhq.vyanhq-draw" }
          if (-not ($spec.PSObject.Properties.Name -contains 'dependencies')) { throw "buildspec.json is missing the dependencies object." }
          if (-not ($spec.dependencies.PSObject.Properties.Name -contains 'obs-studio')) { throw "buildspec.json is missing dependencies.obs-studio." }
          $obsUrl = "https://github.com/obsproject/obs-studio/archive/refs/tags/32.2.2.zip"
          $obsZip = Join-Path $env:GITHUB_WORKSPACE "obs-32.2.2.zip"
          Invoke-WebRequest -Uri $obsUrl -OutFile $obsZip
          $obsHash = (Get-FileHash $obsZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $spec.dependencies.'obs-studio'.hashes.'windows-x64' = $obsHash
          Remove-Item $obsZip -Force
          $spec | ConvertTo-Json -Depth 100 | Set-Content buildspec.json -Encoding UTF8
          $presets = Get-Content CMakePresets.json -Raw | ConvertFrom-Json
          function Ensure-CacheVariables($node) {
            if ($null -eq $node) { return }
            $props = @($node.PSObject.Properties.Name)
            if ($props -contains 'cacheVariables') {
              if ($null -eq $node.cacheVariables) { $node | Add-Member -NotePropertyName cacheVariables -NotePropertyValue ([pscustomobject]@{}) -Force }
              $node.cacheVariables | Add-Member -NotePropertyName ENABLE_FRONTEND_API -NotePropertyValue 'ON' -Force
              $node.cacheVariables | Add-Member -NotePropertyName ENABLE_QT -NotePropertyValue 'ON' -Force
            }
            if ($props -contains 'configurePresets') { foreach ($p in @($node.configurePresets)) { Ensure-CacheVariables $p } }
            if ($props -contains 'buildPresets') { foreach ($p in @($node.buildPresets)) { Ensure-CacheVariables $p } }
          }
          Ensure-CacheVariables $presets
          $presets | ConvertTo-Json -Depth 100 | Set-Content CMakePresets.json -Encoding UTF8

      - name: Fix VyanHQ native source rendering for OBS compositor
        shell: pwsh
        working-directory: obs-template
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "obs-template\src\plugin-main.cpp"
          $text = Get-Content $path -Raw
          $pattern = '(?s)static void sourceVideoRender\(void \*data, gs_effect_t \*effect\)\n\{.*?\n\}\n\nstatic obs_source_info g_sourceInfoInit\(\)'
          $replacement = @'
static void sourceVideoRender(void *data, gs_effect_t *effect)
{
    Q_UNUSED(data);
    if (!g_visible || !effect)
        return;

    QImage composite;
    uint64_t revision = 0;
    {
        QMutexLocker lock(&g_docMutex);
        ensureDocument();
        composite = compositeDocument();
        revision = g_revision;
    }

    if (!g_texture) {
        g_texture = gs_texture_create(kCanvasW, kCanvasH, GS_RGBA, 1, nullptr, GS_DYNAMIC);
        if (!g_texture) {
            blog(LOG_WARNING, "[VyanHQ Draw] failed to create native canvas texture");
            return;
        }
        g_textureRevision = 0;
    }

    if (revision != g_textureRevision) {
        QImage rgba = composite.convertToFormat(QImage::Format_RGBA8888);
        gs_texture_set_image(g_texture, rgba.constBits(), (uint32_t)rgba.bytesPerLine(), false);
        g_textureRevision = revision;
    }

    const bool previousSrgb = gs_framebuffer_srgb_enabled();
    gs_enable_framebuffer_srgb(true);
    gs_blend_state_push();
    gs_blend_function(GS_BLEND_ONE, GS_BLEND_INVSRCALPHA);
    gs_eparam_t *const imageParam = gs_effect_get_param_by_name(effect, "image");
    if (imageParam)
        gs_effect_set_texture_srgb(imageParam, g_texture);
    gs_draw_sprite(g_texture, 0, kCanvasW, kCanvasH);
    gs_blend_state_pop();
    gs_enable_framebuffer_srgb(previousSrgb);
}

static obs_source_info g_sourceInfoInit()
'@
          $newText = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($newText -eq $text) { throw "Could not locate sourceVideoRender block to patch." }
          Set-Content $path -Value $newText -Encoding UTF8
          Write-Host "Patched sourceVideoRender successfully."
          Select-String -Path $path -Pattern 'gs_effect_set_texture_srgb|gs_draw_sprite' -Context 2,2

      - name: Build with official OBS Windows build script
        shell: pwsh
        working-directory: obs-template
        run: |
          ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package Windows plugin
        shell: pwsh
        working-directory: obs-template
        run: |
          ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload build and release artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: VyanHQ-Draw-OBS-Windows-x64
          path: |
            obs-template/release/**
            obs-template/build/**
          if-no-files-found: ignore
