name: Build VyanHQ Draw for Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout VyanHQ Draw
        uses: actions/checkout@v5

      - name: Clone official OBS plugin template
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git obs-template

      - name: Copy VyanHQ files into template
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\src\plugin-main.cpp" "$env:GITHUB_WORKSPACE\obs-template\src\plugin-main.cpp" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\CMakeLists.txt" "$env:GITHUB_WORKSPACE\obs-template\CMakeLists.txt" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\buildspec.json" "$env:GITHUB_WORKSPACE\obs-template\buildspec.json" -Force
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\obs-template\data\locale" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\data\locale\en-US.ini" "$env:GITHUB_WORKSPACE\obs-template\data\locale\en-US.ini" -Force

      - name: Patch template for OBS 32.2.2 and VyanHQ
        shell: pwsh
        working-directory: obs-template
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $spec.email = "vyanhq@example.invalid"

          if (-not ($spec.PSObject.Properties.Name -contains 'platformConfig')) {
            $spec | Add-Member -NotePropertyName platformConfig -NotePropertyValue ([pscustomobject]@{}) -Force
          }
          if (-not ($spec.platformConfig.PSObject.Properties.Name -contains 'macos')) {
            $spec.platformConfig | Add-Member -NotePropertyName macos -NotePropertyValue ([pscustomobject]@{}) -Force
          }
          if (-not ($spec.platformConfig.macos.PSObject.Properties.Name -contains 'bundleId')) {
            $spec.platformConfig.macos | Add-Member -NotePropertyName bundleId -NotePropertyValue "com.vyanhq.vyanhq-draw" -Force
          } else {
            $spec.platformConfig.macos.bundleId = "com.vyanhq.vyanhq-draw"
          }

          if (-not ($spec.PSObject.Properties.Name -contains 'dependencies')) {
            throw "buildspec.json is missing the dependencies object."
          }
          if (-not ($spec.dependencies.PSObject.Properties.Name -contains 'obs-studio')) {
            throw "buildspec.json is missing dependencies.obs-studio."
          }

          $obsUrl = "https://github.com/obsproject/obs-studio/archive/refs/tags/32.2.2.zip"
          $obsZip = Join-Path $env:GITHUB_WORKSPACE "obs-32.2.2.zip"
          Invoke-WebRequest -Uri $obsUrl -OutFile $obsZip
          $obsHash = (Get-FileHash $obsZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $spec.dependencies.'obs-studio'.hashes.'windows-x64' = $obsHash
          Remove-Item $obsZip -Force
          $spec | ConvertTo-Json -Depth 100 | Set-Content buildspec.json -Encoding UTF8

          # The current OBS template has presets that explicitly set these two options
          # to OFF. Add/overwrite them safely with Add-Member -Force so the property may
          # be created when it does not exist.
          $presets = Get-Content CMakePresets.json -Raw | ConvertFrom-Json

          function Ensure-CacheVariables($node) {
            if ($null -eq $node) { return }
            $props = @($node.PSObject.Properties.Name)
            if ($props -contains 'cacheVariables') {
              if ($null -eq $node.cacheVariables) {
                $node | Add-Member -NotePropertyName cacheVariables -NotePropertyValue ([pscustomobject]@{}) -Force
              }
              $node.cacheVariables | Add-Member -NotePropertyName ENABLE_FRONTEND_API -NotePropertyValue 'ON' -Force
              $node.cacheVariables | Add-Member -NotePropertyName ENABLE_QT -NotePropertyValue 'ON' -Force
            }

            if ($props -contains 'configurePresets') {
              foreach ($p in @($node.configurePresets)) { Ensure-CacheVariables $p }
            }
            if ($props -contains 'buildPresets') {
              foreach ($p in @($node.buildPresets)) { Ensure-CacheVariables $p }
            }
          }

          Ensure-CacheVariables $presets
          $presets | ConvertTo-Json -Depth 100 | Set-Content CMakePresets.json -Encoding UTF8

          Write-Host "=== Patched buildspec ==="
          Get-Content buildspec.json
          Write-Host "=== Relevant CMake presets ==="
          Get-Content CMakePresets.json | Select-String -Pattern 'windows-ci-x64|windows-x64|ENABLE_FRONTEND_API|ENABLE_QT' -Context 0,3

      - name: Build with official OBS Windows build script
        shell: pwsh
        working-directory: obs-template
        run: |
          ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package Windows plugin
        shell: pwsh
        working-directory: obs-template
        run: |
          ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload build and release artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: VyanHQ-Draw-OBS-Windows-x64
          path: |
            obs-template/release/**
            obs-template/build/**
          if-no-files-found: ignore
